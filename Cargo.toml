[package]
name = "lumaris"
version = "0.2.0"
edition = "2024"
description = "Lean and fast image viewer for Linux"
license = "GPL-2.0-or-later"
repository = "https://github.com/0xRJDev/Lumaris"
readme = "README.md"
rust-version = "1.88"
keywords = ["image-viewer", "wayland", "kde", "gpu", "viewer"]
categories = ["multimedia::images", "graphics"]

[dependencies]
fontdue = "0.9"
lcms2 = "6"
kamadak-exif = "0.6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
winit = { version = "0.30", default-features = false, features = ["wayland", "wayland-dlopen", "x11", "rwh_06"] }
wgpu = { version = "30", default-features = false, features = ["vulkan", "gles", "wgsl"] }
pollster = "0.4"
ctrlc = { version = "3", features = ["termination"] }
bytemuck = { version = "1", features = ["derive"] }
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols-plasma = { version = "0.3", features = ["client"] }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff", "qoi", "ico", "tga", "pnm", "avif-native", "exr", "hdr", "dds", "ff", "rayon"] }
jpeg2k = "0.11"
xcf = "0.4"
zip = { version = "9", default-features = false, features = ["deflate"] }
resvg = { version = "0.50", default-features = false, features = ["text", "system-fonts", "memmap-fonts", "raster-images"] }
libheif-rs = { version = "3", default-features = false, features = ["v1_17"] }
zune-jpeg = "0.5"
zune-core = "0.5"
jxl-oxide = { version = "0.12", default-features = false, features = ["image", "rayon"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 3
